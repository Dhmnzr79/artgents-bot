# clients/demo/ui.yaml — меню и fallback-ответы (виджет: widget_config.json)
guided_menu:
  answer: "Могу коротко подсказать и помочь выбрать направление — что для вас важнее?"
  quick_replies:
    - label: "Стоимость имплантации"
      ref: "price:implantation/overview"
    - label: "Больно ли ставить имплант?"
      ref: "implantation__faq__pain.md#korotko"
    - label: "Что будет на консультации?"
      ref: "clinic__info__consultation.md#korotko"
    - label: "Хочу записаться"
      ref: "lead:booking"

continuation_clarify:
  answer: "Могу подсказать по услугам, ценам, врачам или записи. Что вас интересует?"

fallback_menu:
  low_score:
    answer: >-
      Не нашла точного ответа. Попробуйте переформулировать вопрос или выберите подходящий раздел ниже.
    cta_action: lead
  no_candidates:
    answer: >-
      Не нашла ответа на этот вопрос. Попробуйте спросить иначе или уточните услугу/ситуацию.
  offtopic:
    answer: >-
      Я помогаю по вопросам клиники: услуги, цены, подготовка, сроки, запись и контакты.
      Если хотите, подскажу по вашему вопросу в этом контексте.
  empty_question:
    answer: "Уточните вопрос."
  bare_affirmative:
    answer: "Напишите, пожалуйста, ваш вопрос — так будет проще подсказать."

price_symptom_consult:
  core_answer: >-
    Чтобы назвать точную цену, нужен осмотр — по описанию не определить.
    Консультация у нашего врача — бесплатно, поможем с налоговым вычетом.
    Записать вас?
  details_answer: >-
    Осмотр, КТ при необходимости, точный план и фиксированная цена.
    ~30 минут, ни к чему не обязывает.
  book_label: "Записаться на бесплатную консультацию"
  details_label: "Что будет на консультации"

consult_nudge:
  exhausted_prompt: |
    Задача на этот ответ:
    Тема для справочного ответа исчерпана.
    Не добавляй рекламный хвост, скидки или утверждение о бесплатной консультации.
    Если нужен следующий шаг, сформулируй его нейтрально и кратко: можно уточнить ситуацию у администратора или врача.
  streak_prompt: |
    Задача на этот ответ:
    Пациент уже несколько раз уточнял по теме клиники.
    Сначала ответь по существу на вопрос.
    Не добавляй рекламный хвост, скидки или утверждение о бесплатной консультации.
    Если нужен следующий шаг, сформулируй его нейтрально: можно уточнить ситуацию у администратора или врача.

messaging:
  anti_spam_soft_redirect: >-
    Я уже ответила по нескольким близким темам. Если хотите, уточните конкретный вопрос или выберите раздел ниже — так я точнее подскажу.
