version: 1

limits:
  max_text_ingredients: 1
  max_cta: 1
  promo_cooldown_turns: 3
  proof_cooldown_turns: 3

blocked_aspects_for_promo:
  - pain
  - contraindications
  - safety
  - complications

service_marketing:
  classic:
    clinic_proof:
      - "Классическую имплантацию у нас ведут имплантологи с опытом от 10 лет: 3D-план по КТ, понятные этапы и смета до начала лечения — без скрытых доплат."
    consult_reasons:
      - "оценить кость и соседние зубы, сравнить системы имплантов и составить поэтапный план восстановления"
    primary_cta_key: doctor

  one_stage:
    clinic_proof:
      - "Одномоментную имплантацию у нас делают по строгому протоколу: КТ, цифровое моделирование и хирург, который специализируется именно на таких случаях."
    consult_reasons:
      - "проверить, можно ли удалить зуб и поставить имплант в один день именно в вашей ситуации"
    primary_cta_key: doctor

  all_on_4:
    clinic_proof:
      - "All-on-4 у нас — отдельный протокол: полная диагностика, моделирование улыбки и временный протез в день операции, всё в одной клинике."
    consult_reasons:
      - "оценить КТ и понять, подходит ли протокол All-on-4 или лучше рассмотреть другой вариант восстановления"
    primary_cta_key: doctor

  all_on_6:
    clinic_proof:
      - "All-on-6 мы проводим там, где нужен запас прочности: шесть опор, 3D-план и сопровождение до постоянного протеза — без передачи между разными кабинетами."
    consult_reasons:
      - "сравнить All-on-4 и All-on-6 по КТ и объяснить, сколько опор нужно именно вам"
    primary_cta_key: doctor

  temporary_teeth:
    consult_reasons:
      - "обсудить временные зубы на период лечения и понять, какой вариант будет удобнее по срокам и нагрузке"
    primary_cta_key: doctor

  benefits:
    clinic_proof:
      - "Имплантацию у нас ведут по международным протоколам с контролем приживления на каждом визите — это наш стандарт работы, а не исключение."
    consult_reasons:
      - "объяснить, какие преимущества имплантации актуальны для вашей ситуации, без общих обещаний"
    primary_cta_key: consult

  what_included:
    clinic_proof:
      - "Перед началом лечения врач показывает этапы и смету: что относится к хирургии, что к коронке или протезу, и когда каждый этап оплачивается."
    consult_reasons:
      - "уточнить, что входит именно в ваш план: имплант, временная конструкция, коронка, протезирование и контрольные визиты"
    primary_cta_key: consult

  sinus_lift:
    clinic_proof:
      - "Синус-лифтинг планируем по КТ: врач заранее оценивает высоту кости и объясняет, можно ли поставить имплант сразу или нужен отдельный этап подготовки."
    consult_reasons:
      - "показать по снимку, действительно ли нужен синус-лифтинг, какой вариант подойдёт и как это повлияет на сроки имплантации"
    primary_cta_key: doctor

  pterygoid_implants:
    clinic_proof:
      - "Птеригоидные импланты рассматриваем только после КТ: врач заранее оценивает анатомию, нагрузку и объясняет, можно ли обойтись без дополнительного наращивания кости."
    consult_reasons:
      - "сравнить варианты восстановления верхней челюсти и показать, когда птеригоидные импланты действительно имеют смысл"
    primary_cta_key: doctor

  zygomatic_implants:
    clinic_proof:
      - "Скуловую имплантацию рассматриваем только после КТ и полного планирования: здесь особенно важны точность, опыт хирурга и понятный план восстановления зубов."
    consult_reasons:
      - "показать по снимку, подходит ли вам скуловая имплантация или можно выбрать более простой вариант"
    primary_cta_key: doctor

  teeth_whitening:
    clinic_proof:
      - "Перед отбеливанием врач оценивает эмаль, старые пломбы и чувствительность зубов, чтобы подобрать безопасный способ осветления."
    consult_reasons:
      - "объяснить, какой оттенок реально получить и стоит ли сначала сделать гигиену или лечение"
    primary_cta_key: consult

  tooth_extraction:
    clinic_proof:
      - "Перед удалением врач сначала оценивает, можно ли сохранить зуб. Если удаление действительно нужно, всё планируют аккуратно — с учётом дальнейшего восстановления."
    consult_reasons:
      - "оценить снимок, понять, можно ли сохранить зуб, и спланировать восстановление после удаления"
    primary_cta_key: doctor

  periodontitis:
    consult_reasons:
      - "оценить состояние десен, глубину воспаления и подобрать план лечения без лишних процедур"
    primary_cta_key: doctor

