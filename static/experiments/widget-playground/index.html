<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>Artgents — шрифты и отступы виджета</title>
  <link rel="stylesheet" href="fonts.css">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="reference-cards.css">
  <script src="reference-data.js" defer></script>
  <script src="reference-renderer.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <header class="lab-bar">
    <strong>Artgents · v2 <span>· 17.10</span></strong>
    <div class="font-switch" role="group" aria-label="Шрифт"><button data-font="Inter" aria-pressed="true">Inter</button><button data-font="Roboto" aria-pressed="false">Roboto</button></div>

  </header>
  <main class="preview">
    <section class="widget" aria-label="Консультант клиники">
      <header class="widget-header"><img src="assets/avatar.png" width="40" height="40" alt=""><div><strong>Надежда</strong><p>ИИ-консультант Artgents</p></div><button class="icon-button" id="collapse-widget" aria-label="Свернуть виджет">×</button></header>
      <nav class="tabs" role="tablist" aria-label="Разделы виджета">
        <button id="tab-chat" role="tab" data-tab="chat" aria-controls="panel-chat" aria-selected="true">Помощник</button>
        <button id="tab-catalog" role="tab" data-tab="catalog" aria-controls="panel-catalog" aria-selected="false" tabindex="-1">Услуги и цены</button>
        <button id="tab-booking" role="tab" data-tab="booking" aria-controls="panel-booking" aria-selected="false" tabindex="-1">Запись</button>
      </nav>
      <section id="panel-chat" class="tab-panel chat-panel" role="tabpanel" aria-labelledby="tab-chat">
        <div id="feed" class="feed" aria-label="Переписка" tabindex="0"></div>
        <form id="composer" class="composer"><label class="sr-only" for="question">Ваш вопрос</label><div class="composer-field"><textarea id="question" rows="1" placeholder="Напишите сообщение…"></textarea><button class="send" aria-label="Отправить сообщение"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m21 3-7.1 18-3.8-7.1L3 10.1 21 3Z"/><path d="m10.1 13.9 6.2-6.2"/></svg></button></div></form>
      </section>
      <section id="panel-catalog" class="tab-panel scroll-panel" role="tabpanel" aria-labelledby="tab-catalog" hidden><div id="catalog"></div></section>
      <section id="panel-booking" class="tab-panel scroll-panel" role="tabpanel" aria-labelledby="tab-booking" hidden><div id="booking-form" class="form-mount"></div></section>
    </section>
    <button id="reopen-widget" class="primary reopen" hidden>Открыть помощника</button>
  </main>
</body>
</html>
