# Explicit clinic business constraints (not retrieved from md).
contact:
  phone_display: "+7 (495) 128-47-60"
  whatsapp_display: "+7 (916) 842-17-30"
  address_display: "г. Москва, ул. Тверская, 12, стр. 1 (м. «Пушкинская», 5 мин пешком)"
  hours_display: "Пн–Пт 09:00–21:00, Сб 10:00–18:00, Вс — выходной"
  parking_display: "городская парковка у здания; для пациентов — 2 часа бесплатно по пропуску на ресепшене"

policies:
  no_pediatric_dentistry:
    triggers:
      - "детск"
      - "ребен"
      - "ребён"
      - "детей"
      - "детям"
      - "малыш"
      - "несовершеннолет"
    text_ref: clinic__info__policies.md#no_pediatric_dentistry

  no_oms:
    triggers:
      - "омс"
      - "полис омс"
      - "по омс"
    text_ref: clinic__info__policies.md#no_oms

  no_dms:
    triggers:
      - "дмс"
      - "полис дмс"
      - "по дмс"
    text_ref: clinic__info__policies.md#no_dms

service_alternatives:
  - requested_service_id: braces
    alternative_service_ids:
      - aligners
    text_ref: clinic__info__policies.md#braces

brand_alternatives:
  - requested_brand_id: osstem
    text_ref: clinic__info__policies.md#brendy

service_not_offered_template: >-
  К сожалению, услугу «{requested_service}» в нашей клинике не оказываем.
  Могу подсказать по направлениям, которые у нас есть.

hard_stop_template: >-
  Я помогаю по вопросам клиники: услуги, цены, запись и контакты.
  Если у вас есть вопрос по стоматологии в рамках нашей клиники — напишите, пожалуйста.

spam_one_chance_template: >-
  Напишите, пожалуйста, понятный вопрос по стоматологии — так я смогу помочь.

spam_closed_template: >-
  Диалог завершён. Чтобы задать новый вопрос, начните новый чат.

manual_contact_template: >-
  Такой вопрос лучше решить напрямую с клиникой — так будет быстрее и корректнее.
  Пожалуйста, позвоните нам{phone_suffix}.{urgent_suffix}

manual_contact_urgent_suffix: >-
   Если ситуация срочная, не ждите ответа в чате — лучше позвонить сразу.
