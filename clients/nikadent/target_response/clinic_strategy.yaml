version: 1
default_max_options: 3
default_service_priorities: {}
default_offer_priorities: {}
rules:
  - id: full_arch_restore
    match:
      extent: full_arch
    max_options: 3
    service_priorities:
      all_on_4: 100
      all_on_6: 90
      removable_dentures: 50
    offer_priorities: {}
  - id: one_tooth_restore
    match:
      extent: one_tooth
    max_options: 3
    service_priorities:
      classic: 100
      one_stage: 80
      zirconia_crowns: 60
    offer_priorities: {}
