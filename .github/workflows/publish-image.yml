# G3 — fail-closed verify + secret scan, then build once, smoke, push, receipt.
name: Publish production image

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: publish-production-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-ci.lock

      - name: Install CI dependencies from lock
        run: pip install --require-hashes -r requirements-ci.lock

      - name: Lint client md (all packs)
        run: python scripts/lint_content.py --client all

      - name: Lint pricebook (target_response invariants)
        run: python scripts/lint_pricebook.py

      - name: Validate client pack (demo)
        run: python scripts/validate_client_pack.py --client-id demo

      - name: Validate client pack (_template)
        run: python scripts/validate_client_pack.py --client-id _template

      - name: App import smoke
        run: python -c "import app"

      - name: Compile production Python sources
        env:
          PYTHONPYCACHEPREFIX: ${{ runner.temp }}/pycache
        run: |
          python <<'PY'
          import compileall
          import pathlib
          import sys

          root = pathlib.Path(".").resolve()
          skip_dirs = {
              ".git",
              ".venv",
              "venv",
              "tests",
              "evals",
              "docs",
              ".pytest_cache",
              "__pycache__",
              "data",
              "logs",
              "drafts",
              "agent-transcripts",
              "terminals",
          }
          failed = False
          for path in sorted(root.rglob("*.py")):
              if skip_dirs.intersection(path.parts):
                  continue
              ok = compileall.compile_file(str(path), quiet=1)
              if ok is False:
                  failed = True
          if failed:
              sys.exit(1)
          PY

      - name: Offline unit, G2/G3 contracts
        env:
          BASETEMP: ${{ runner.temp }}/pytest-basetemp
        run: |
          unset DASHSCOPE_API_KEY CHAT_API_KEY OPENAI_API_KEY SMTP_PASSWORD SMTP_USER BOT_PG_DSN BOT_MIGRATOR_PG_DSN BOT_TEST_PG_DSN ADMIN_DASHBOARD_TOKEN || true
          mkdir -p "$BASETEMP"
          # TEMPORARY DEMO GATE (2026-10-14): same selections as both PR CI jobs, plus G3.
          # TODO(after demo): finish invariant coverage review; migrate useful guards only, never restore cancelled contracts.
          sort -u tests/release/offline.txt tests/release/policy.txt > "$BASETEMP/release-tests.txt"
          python -m pytest -p no:cacheprovider --basetemp "$BASETEMP" --tb=short -q "@$BASETEMP/release-tests.txt" tests/test_g3_immutable_image_contract.py

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0; bundles gitleaks CLI with --redact
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
          GITLEAKS_ENABLE_SUMMARY: "false"
          GITLEAKS_VERSION: "8.24.3"

  build-test-and-publish:
    name: Build, test and publish
    needs:
      - verify
      - secret-scan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/dhmnzr79/artgents-bot
      IMAGE_TAG: ${{ github.sha }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - name: Build production image (single load into daemon)
        id: docker_build
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: ./Dockerfile
          load: true
          push: false
          tags: ${{ env.IMAGE }}:${{ env.IMAGE_TAG }}
          platforms: linux/amd64
          build-args: |
            SOURCE_SHA=${{ github.sha }}

      - name: Record local image ID
        id: local_image
        run: |
          IMAGE_REF="${IMAGE}:${IMAGE_TAG}"
          docker image inspect "$IMAGE_REF" >/dev/null
          LOCAL_ID=$(docker image inspect --format='{{.Id}}' "$IMAGE_REF")
          echo "local_image_id=${LOCAL_ID}" >> "$GITHUB_OUTPUT"

      - name: Smoke test exact local image
        id: smoke
        run: |
          set -euo pipefail
          IMAGE_REF="${IMAGE}:${IMAGE_TAG}"
          HOST_PORT=18080
          CID=$(docker run -d --rm -e GITHUB_ACTIONS=true -p "127.0.0.1:${HOST_PORT}:8000" "$IMAGE_REF")
          cleanup() { docker stop -t 10 "$CID" >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          RUNTIME_UID=$(docker exec "$CID" id -u)
          if [ "$RUNTIME_UID" != "10001" ]; then
            echo "expected non-root uid 10001, got ${RUNTIME_UID}"
            exit 1
          fi
          docker exec "$CID" python -c "import app"
          ok=0
          for _ in $(seq 1 45); do
            if curl -sf "http://127.0.0.1:${HOST_PORT}/health/live" >/dev/null; then
              ok=1
              break
            fi
            sleep 2
          done
          if [ "$ok" != "1" ]; then
            echo "health/live did not become ready"
            docker logs "$CID" | tail -n 80
            exit 1
          fi

      - uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push verified local image
        id: registry_push
        run: |
          set -euo pipefail
          IMAGE_REF="${IMAGE}:${IMAGE_TAG}"
          docker push "$IMAGE_REF" 2>&1 | tee /tmp/docker-push.log
          DIGEST=$(python <<'PY'
          import re
          import sys
          from pathlib import Path

          text = Path("/tmp/docker-push.log").read_text(encoding="utf-8", errors="replace")
          found = re.findall(r"digest:\s*(sha256:[0-9a-f]{64})", text)
          unique = sorted(set(found))
          if len(unique) != 1:
              sys.stderr.write(f"expected exactly one digest, found {unique!r}\n")
              sys.exit(1)
          print(unique[0])
          PY
          )
          if ! echo "$DIGEST" | grep -Eq '^sha256:[0-9a-f]{64}$'; then
            echo "invalid registry digest: ${DIGEST:-<empty>}"
            exit 1
          fi
          echo "registry_digest=${DIGEST}" >> "$GITHUB_OUTPUT"

      - name: Write publish receipt
        id: receipt
        env:
          LOCAL_IMAGE_ID: ${{ steps.local_image.outputs.local_image_id }}
          REGISTRY_DIGEST: ${{ steps.registry_push.outputs.registry_digest }}
        run: |
          set -euo pipefail
          IMMUTABLE="${IMAGE}@${REGISTRY_DIGEST}"
          python -c "
          import json, os
          from pathlib import Path
          img = os.environ['IMAGE']
          tag = os.environ['IMAGE_TAG']
          digest = os.environ['REGISTRY_DIGEST']
          payload = {
              'repository': img,
              'source_sha': tag,
              'tag': tag,
              'local_image_id': os.environ['LOCAL_IMAGE_ID'],
              'registry_digest': digest,
              'immutable_reference': f'{img}@{digest}',
          }
          Path('publish-receipt.json').write_text(
              json.dumps(payload, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          "
          {
            echo "## Production image published"
            echo ""
            echo "- repository: \`${IMAGE}\`"
            echo "- source_sha: \`${IMAGE_TAG}\`"
            echo "- tag: \`${IMAGE_TAG}\`"
            echo "- local_image_id: \`${LOCAL_IMAGE_ID}\`"
            echo "- registry_digest: \`${REGISTRY_DIGEST}\`"
            echo "- immutable_reference: \`${IMMUTABLE}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: publish-receipt-${{ github.sha }}
          path: publish-receipt.json
          retention-days: 90
          if-no-files-found: error
