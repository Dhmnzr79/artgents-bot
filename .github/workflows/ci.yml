# G2 — Pull Request CI: lint/validate, offline contracts, secret scan (no provider secrets).
name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-validate:
    name: Lint and validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-ci.lock

      - name: Install dependencies
        run: pip install --require-hashes -r requirements-ci.lock

      - name: Lint client md (all packs)
        run: python scripts/lint_content.py --client all

      - name: Lint pricebook (target_response invariants)
        run: python scripts/lint_pricebook.py

      - name: Validate client pack (demo)
        run: python scripts/validate_client_pack.py --client-id demo

      - name: Validate client pack (_template)
        run: python scripts/validate_client_pack.py --client-id _template

      - name: App import smoke
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -c "import app"

      - name: Compile production Python sources
        env:
          PYTHONPYCACHEPREFIX: ${{ runner.temp }}/pycache
        run: |
          python <<'PY'
          import compileall
          import pathlib
          import sys

          root = pathlib.Path(".").resolve()
          skip_dirs = {
              ".git",
              ".venv",
              "venv",
              "tests",
              "evals",
              "docs",
              ".pytest_cache",
              "__pycache__",
              "data",
              "logs",
              "drafts",
              "agent-transcripts",
              "terminals",
          }
          failed = False
          for path in sorted(root.rglob("*.py")):
              if skip_dirs.intersection(path.parts):
                  continue
              ok = compileall.compile_file(str(path), quiet=1)
              if ok is False:
                  failed = True
          if failed:
              sys.exit(1)
          PY

  # TEMPORARY DEMO GATE — owner-approved for the 2026-10-14 demo only.
  # TODO(after demo): finish invariant coverage review; migrate useful guards only, never restore cancelled contracts.
  # Historical tests remain in the repository; no runtime/legacy compatibility changes.
  offline-unit-and-contracts:
    name: Offline unit and contracts
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-ci.lock

      - name: Install dependencies
        run: pip install --require-hashes -r requirements-ci.lock

      - name: Offline unit and contract tests
        env:
          BASETEMP: ${{ runner.temp }}/pytest-basetemp
        run: |
          unset DASHSCOPE_API_KEY CHAT_API_KEY OPENAI_API_KEY SMTP_PASSWORD SMTP_USER BOT_PG_DSN BOT_MIGRATOR_PG_DSN BOT_TEST_PG_DSN ADMIN_DASHBOARD_TOKEN || true
          mkdir -p "$BASETEMP"
          python -m pytest -p no:cacheprovider --basetemp "$BASETEMP" --tb=short -q @tests/release/offline.txt

  # TEMPORARY DEMO GATE — owner-approved for the 2026-10-14 demo only.
  # TODO(after demo): finish invariant coverage review; migrate useful guards only, never restore cancelled contracts.
  # Historical tests remain in the repository; no runtime/legacy compatibility changes.
  demo-d1-clinic-policy-regression:
    name: Demo D1 clinic policy regression
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      CHAT_API_KEY: offline-ci-dummy-not-a-secret
      CHAT_BASE_URL: https://dashscope.aliyuncs.com/compatible-mode/v1
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-ci.lock

      - name: Install dependencies
        run: pip install --require-hashes -r requirements-ci.lock

      - name: Current D2 offline clinic policy regressions
        env:
          BASETEMP: ${{ runner.temp }}/pytest-basetemp-d1r
        run: |
          unset DASHSCOPE_API_KEY CHAT_API_KEY OPENAI_API_KEY SMTP_PASSWORD SMTP_USER BOT_PG_DSN BOT_MIGRATOR_PG_DSN BOT_TEST_PG_DSN ADMIN_DASHBOARD_TOKEN || true
          mkdir -p "$BASETEMP"
          python -m pytest -p no:cacheprovider --basetemp "$BASETEMP" --tb=short -q @tests/release/policy.txt

  postgres-qualification:
    name: PostgreSQL qualification
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      G8_BOOTSTRAP_USER: g8_bootstrap
      G8_BOOTSTRAP_PASSWORD: g8_disposable_bootstrap_ci_only
    services:
      postgres:
        image: postgres:16.8-bookworm@sha256:e75c0253ec375a157657c75bbb1705a8bbdd844d5f258973f9e3eb33cfcd9e33
        env:
          POSTGRES_USER: g8_bootstrap
          POSTGRES_PASSWORD: g8_disposable_bootstrap_ci_only
          POSTGRES_DB: g8_qual_primary
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U g8_bootstrap -d g8_qual_primary"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-ci.lock

      - name: Install dependencies
        run: pip install --require-hashes -r requirements-ci.lock

      - name: G8 disposable PostgreSQL qualification
        env:
          G8_POSTGRES_CONTAINER_ID: ${{ job.services.postgres.id }}
        run: python -m deploy.postgres.g8_qualification_runner

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0; bundles gitleaks CLI with --redact
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
          GITLEAKS_ENABLE_SUMMARY: "false"
          GITLEAKS_VERSION: "8.24.3"
