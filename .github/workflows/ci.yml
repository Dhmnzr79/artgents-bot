# CI — content lint, unit tests, demo product evals (implant + e2e smoke).
# Optional on multiclient only: metadata-first eval (continue-on-error until routing pack is green).
# Secrets: OPENAI_API_KEY (required for in-proc eval jobs).

name: CI

on:
  push:
    branches:
      - main
      - master
      - multiclient
      - "feature/**"
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  content-lint-and-unit:
    name: Content lint + unit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # lint imports config.py, which requires OPENAI_API_KEY at import time
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Check OPENAI_API_KEY (config import)
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "::error::OPENAI_API_KEY secret required (config.py loads on lint import)."
            exit 1
          fi

      - name: Lint client md (all packs)
        run: python scripts/lint_content.py --client all

      - name: Unit tests (smoke helpers + routing)
        run: |
          python -m pytest \
            tests/test_metadata_first_eval_helpers.py \
            tests/test_metadata_first_scope.py \
            tests/test_metadata_first_observability.py \
            tests/test_finalize_metadata_first_hook.py \
            tests/test_e2e_smoke_infer.py \
            tests/test_candidate_builder.py \
            -q --tb=short

      - name: Alias collision report (non-blocking inventory)
        run: python scripts/alias_collision_report.py --client all

  implant-golden-eval:
    name: Implant golden (demo, in-proc)
    runs-on: ubuntu-latest
    needs: content-lint-and-unit
    timeout-minutes: 60
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check OPENAI_API_KEY
        run: |
          if [ -z "$OPENAI_API_KEY" ] || [ "$OPENAI_API_KEY" = "github-actions-placeholder" ]; then
            echo "::error::Add repository secret OPENAI_API_KEY (Settings → Secrets → Actions)."
            exit 1
          fi

      - name: Run implant golden (28 cases)
        env:
          E2E_USE_TEST_CLIENT: "1"
          IMPLANT_EVAL_CLIENT: "demo"
          PYTHONUNBUFFERED: "1"
        run: python evals/v5/run_implant_eval.py --client demo

  e2e-smoke-eval:
    name: E2E smoke (demo, in-proc)
    runs-on: ubuntu-latest
    needs: content-lint-and-unit
    timeout-minutes: 60
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check OPENAI_API_KEY
        run: |
          if [ -z "$OPENAI_API_KEY" ] || [ "$OPENAI_API_KEY" = "github-actions-placeholder" ]; then
            echo "::error::Add repository secret OPENAI_API_KEY (Settings → Secrets → Actions)."
            exit 1
          fi

      - name: Run e2e smoke
        env:
          E2E_USE_TEST_CLIENT: "1"
          E2E_SMOKE_CLIENT: "demo"
          PYTHONUNBUFFERED: "1"
        run: python evals/v5/run_e2e_smoke.py --client demo

  metadata-first-eval:
    name: Metadata-first eval (multiclient, optional)
    runs-on: ubuntu-latest
    needs: content-lint-and-unit
    if: github.ref == 'refs/heads/multiclient' || github.base_ref == 'multiclient'
    continue-on-error: true
    timeout-minutes: 45
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check OPENAI_API_KEY
        run: |
          if [ -z "$OPENAI_API_KEY" ] || [ "$OPENAI_API_KEY" = "github-actions-placeholder" ]; then
            echo "::error::Add repository secret OPENAI_API_KEY (Settings → Secrets → Actions)."
            exit 1
          fi

      - name: Run metadata-first golden + smoke
        env:
          E2E_USE_TEST_CLIENT: "1"
          MF_EVAL_CLIENT: "demo"
          PYTHONUNBUFFERED: "1"
        run: python evals/v5/run_metadata_first_eval.py --suite all --client demo
