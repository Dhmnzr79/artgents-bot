# CI — content lint, metadata-first unit tests, in-proc metadata-first eval.
# Secrets: OPENAI_API_KEY (required for metadata-first-eval job).

name: CI

on:
  push:
    branches: [main, master, multiclient]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  content-lint-and-unit:
    name: Content lint + unit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # lint imports config.py, which requires OPENAI_API_KEY at import time
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Check OPENAI_API_KEY (config import)
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "::error::OPENAI_API_KEY secret required (config.py loads on lint import)."
            exit 1
          fi

      - name: Lint client md (all packs)
        run: python scripts/lint_content.py --client all

      - name: Unit tests (metadata-first + smoke helpers)
        run: |
          python -m pytest \
            tests/test_metadata_first_eval_helpers.py \
            tests/test_metadata_first_scope.py \
            tests/test_metadata_first_observability.py \
            tests/test_finalize_metadata_first_hook.py \
            tests/test_e2e_smoke_infer.py \
            tests/test_candidate_builder.py \
            -q --tb=short

      - name: Alias collision report (non-blocking inventory)
        run: python scripts/alias_collision_report.py --client all

  metadata-first-eval:
    name: Metadata-first eval (in-proc)
    runs-on: ubuntu-latest
    needs: content-lint-and-unit
    timeout-minutes: 45
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check OPENAI_API_KEY
        run: |
          if [ -z "$OPENAI_API_KEY" ] || [ "$OPENAI_API_KEY" = "github-actions-placeholder" ]; then
            echo "::error::Add repository secret OPENAI_API_KEY (Settings → Secrets → Actions)."
            exit 1
          fi

      - name: Run metadata-first golden + smoke
        env:
          E2E_USE_TEST_CLIENT: "1"
          PYTHONUNBUFFERED: "1"
        run: python evals/v5/run_metadata_first_eval.py --suite all
